name: primeira-pipeline
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  primeiro-job:
    name: "Meu Primeiro Job"
    runs-on: ubuntu-latest
    steps:
      - name: "Minha Primeira Ação"
        run: echo "Hello World!"
      - name: "Segunda Ação"
        run: |
          echo "Você criou o seu primero workflow!!!"
          echo "Parabéns!!"
      - name: "Script Python"
        run: |
          variavel = "Teste Python, hello world!"
          print(variavel)
        shell: python
  segundo-job:
    name: "Insltalação do ambinete NodeJS"
    runs-on: ubuntu-latest
    steps:
      - name: "Verificação do Versão do NodeJS atual"
        run: node --verion
